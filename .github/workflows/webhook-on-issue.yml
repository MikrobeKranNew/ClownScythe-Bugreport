name: Webhook when new Issue

on:
  issues:
    types: [opened, reopened]

jobs:
  send-webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Send Data to Webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_ACTION: ${{ github.event.action }}

        run: |
          if [ "$ISSUE_ACTION" = "reopened" ]; then
            MESSAGE="🔄 GitHub Issue reopened!"
          else
            MESSAGE="🆕 New GitHub Issue created!"
          fi

          jq -n \
            --arg content "$MESSAGE" \
            --arg title "$ISSUE_TITLE" \
            --arg url "$ISSUE_URL" \
            --arg author "$ISSUE_AUTHOR" \
            --arg body "$ISSUE_BODY" \
            '{
              content: $content,
              embeds: [
                {
                  title: $title,
                  url: $url,
                  description: (
                    if $body == "" then "No description provided."
                    else $body
                    end
                  ),
                  color: 5763719,
                  author: {
                    name: $author
                  },
                  footer: {
                    text: "GitHub Issues"
                  }
                }
              ]
            }' | curl -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @- \
              --fail-with-body \
              --show-error
